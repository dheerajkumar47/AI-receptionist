# Builds, tests and deploys the app to Azure App Service on every push to main.
# One-time setup (docs/SETUP.md §9): add the repository variable AZURE_WEBAPP_NAME and the secret
# AZURE_WEBAPP_PUBLISH_PROFILE. Until both exist, only the build and tests run.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - run: dotnet publish src/AiReceptionist.Web --configuration Release --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  deploy:
    needs: build
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
